[package]
name = "speak-local-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["whisper-rs/openmp"]
# Enables whisper.cpp CUDA backend (requires the CUDA toolkit on the host).
cuda = ["whisper-rs/cuda"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "http2", "rustls", "rustls-native-certs"] }
whisper-rs = { version = "0.16", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mkv", "ogg", "isomp4", "adpcm", "pcm", "wav"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
bytes = "1"

[dev-dependencies]
tempfile = "3"
